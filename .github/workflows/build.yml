name: Build search index

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zostavenie indexu z exportu Shoptetu
        env:
          EXPORT_URL: ${{ secrets.EXPORT_URL }}
        run: node scripts/build-index.mjs
      # v1.3: história cien do vetvy „ceny“ (najnižšia cena za 30 dní). Chyba tu nezastaví index.
      - name: Uloženie histórie cien (vetva ceny)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" ceny >/dev/null 2>&1; then
            git clone -q --depth 1 --branch ceny "$REMOTE" ceny-data
          else
            mkdir ceny-data && git -C ceny-data init -q -b ceny && git -C ceny-data remote add origin "$REMOTE"
          fi
          node scripts/ceny.mjs
          cd ceny-data
          git add -A
          if git diff --cached --quiet; then echo "Ceny bez zmeny"; exit 0; fi
          git commit -q -m "ceny $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin ceny
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub vypína plánované úlohy po 60 dňoch bez zmeny v repozitári.
  # Raz za mesiac preto zapíše malú zmenu, aby aktualizácia nikdy nezastala.
  keepalive:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Udržanie automatiky v chode
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            date -u > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive"
            git push
          fi
